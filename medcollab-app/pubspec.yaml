name: medcollab_app
description: Medical collaboration platform for hospital teams — MedCollab MVP.
publish_to: 'none'
version: 1.0.0+26

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Networking
  dio: ^5.8.0+1
  socket_io_client: ^3.1.2

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Navigation
  go_router: ^14.8.1

  # Utilities
  intl: ^0.20.2
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  sendotp_flutter_sdk: ^0.0.2
  share_plus: ^10.1.4
  qr_flutter: ^4.1.0
  crop_your_image: ^1.1.0
  # Pure-Dart QR decode from camera/gallery photo (no ML Kit / mobile_scanner).
  zxing2: ^0.2.3
  image: ^4.5.4
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  path: ^1.9.1
  camera: ^0.11.0+2
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^19.5.0
  # Avoid mobile_scanner — Kotlin/ML Kit release build breaks on this toolchain.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/vocle_icon.jpeg
  adaptive_icon_background: "#0D1B3E"
  adaptive_icon_foreground: assets/branding/vocle_icon.jpeg

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/data/