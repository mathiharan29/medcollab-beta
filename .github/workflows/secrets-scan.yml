name: Secret Scan

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-secrets-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  gitleaks:
    name: Scan for hardcoded secrets
    runs-on: ubuntu-latest

    steps:
      - name: Validate supported PR or manual context
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          QA_REPOSITORY: ${{ github.repository }}
          QA_EVENT: ${{ github.event_name }}
          QA_REF: ${{ github.ref }}
          QA_SHA: ${{ github.sha }}
          QA_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          QA_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          test "$QA_REPOSITORY" = mathiharan29/medcollab-beta
          if [ "$QA_EVENT" = pull_request ]; then
            test "$QA_HEAD_REPOSITORY" = mathiharan29/medcollab-beta
            test "$QA_BASE_REF" = master
          else
            test "$QA_EVENT" = workflow_dispatch
            [[ "$QA_REF" == refs/heads/?* ]]
            [[ "$QA_SHA" =~ ^[0-9a-f]{40}$ ]]
          fi
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  visual-report:
    name: Visual QA report
    if: always()
    needs: [gitleaks]
    uses: ./.github/workflows/vocle-reporting.yml
    with:
      workflow_file: secrets-scan.yml
      original_jobs: ${{ toJSON(needs) }}
