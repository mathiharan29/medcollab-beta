name: Vocle — Digital Audio Source Probe

on:
  push:
    branches: [testing/voice-digital-audio-probe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            target: google_apis
          - api: 36
            target: google_apis_playstore
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Prepare SDK and disposable emulator
        env:
          SYSTEM_IMAGE: system-images;android-${{ matrix.api }};${{ matrix.target }};x86_64
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm
          cmdline="$ANDROID_HOME/cmdline-tools/latest/bin"
          "$cmdline/sdkmanager" --install "emulator" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "$SYSTEM_IMAGE"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/vocle-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'ANDROID_AVD_HOME=%s\n' "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          "$cmdline/avdmanager" create avd --name vocle-audio-source --package "$SYSTEM_IMAGE" \
            --path "$ANDROID_AVD_HOME/vocle-audio-source.avd" --device pixel_7 --force <<< no
          test -s "$ANDROID_AVD_HOME/vocle-audio-source.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx vocle-audio-source
      - name: Run standalone recognition probe with emulator audio disabled
        env:
          VOCLE_PROBE_SAMPLE: chat-with-bala
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/vocle-audio-source"
          mkdir -p "$output"
          adb="$ANDROID_HOME/platform-tools/adb"
          android_user_dir="${ANDROID_USER_HOME:-$HOME/.android}"
          mkdir -p "$android_user_dir"
          if [ ! -s "$android_user_dir/adbkey.pub" ]; then
            "$adb" keygen "$android_user_dir/adbkey"
          fi
          export ADB_VENDOR_KEYS="$android_user_dir/adbkey"
          "$adb" start-server
          "$ANDROID_HOME/emulator/emulator" -avd vocle-audio-source -no-window -no-audio \
            -no-snapshot -wipe-data -no-boot-anim -gpu swiftshader -memory 3072 -cores 2 \
            > "$output/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          end=$((SECONDS + 240))
          until [ "$(timeout 8 "$adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && timeout 8 "$adb" shell pm path android; do
            if [ "$SECONDS" -ge "$end" ] || ! kill -0 "$emulator_pid" 2>/dev/null; then
              timeout 8 "$adb" devices -l > "$output/adb-devices.txt" || true
              echo "::error::The Android emulator never became ready"
              exit 1
            fi
            sleep 3
          done
          bash tests/functional-regression/voice-audio/android-probe/run.sh "$output"
      - name: Upload recognition evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audio-source-${{ matrix.api }}-${{ matrix.target }}
          path: ${{ runner.temp }}/vocle-audio-source
          if-no-files-found: warn
          retention-days: 30
